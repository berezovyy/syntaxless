<!doctype html>
<!--
  GitHub social preview, 1280×640. Regenerate social-preview.png from the repository root with:
    chrome-headless-shell --allow-file-access-from-files --hide-scrollbars --window-size=1280,640 \
      --screenshot=docs/media/logo/social-preview.png "file://$PWD/docs/media/logo/social-preview.html"
  then upload it in Settings → General → Social preview.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../v3/shared/fonts/jetbrainsmono.woff2") format("woff2");
      }
      html,
      body {
        margin: 0;
        width: 1280px;
        height: 640px;
        background: #1f2430;
        color: #cccac2;
        font-family: "JetBrains Mono", monospace;
      }
      main {
        box-sizing: border-box;
        height: 100%;
        padding: 0 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 44px;
      }
      img {
        width: 880px;
      }
      h1 {
        margin: 0;
        font-size: 34px;
        white-space: nowrap;
        font-weight: 500;
        color: #ffcc66;
      }
      p {
        margin: 0;
        font-size: 20px;
        white-space: nowrap;
        line-height: 1.6;
        color: #8a9199;
      }
      b {
        font-weight: 400;
        color: #cccac2;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo-dark.svg" alt="Syntaxless" />
      <h1>Plain English in. Typed, deterministic output out.</h1>
      <p>
        <b>cron</b> · <b>JSON Schema</b> · <b>SQL WHERE/ORDER BY</b> · <b>retry backoff</b> ·
        <b>backup retention</b> · <b>Intl formats</b><br />
        On-device TypeScript parsers, under 100 kB, zero dependencies.
      </p>
    </main>
  </body>
</html>
