<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Syntaxless: format</title>
    <script src="shared/vendor/gsap.min.js"></script>
    <script src="shared/vendor/CustomEase.min.js"></script>
    <link rel="stylesheet" href="shared/sx.css" />
    <style>
      /* 11 lines of code and two runs of six values: the terminal takes a tall right column,
         so both locales stay on screen; the package card sits under the editor. */
      #editor {
        left: 72px;
        top: 128px;
        width: 1180px;
        height: 554px;
      }
      #pkg {
        left: 72px;
        top: 702px;
        width: 1180px;
        height: 306px;
      }
      #term {
        left: 1272px;
        top: 128px;
        width: 576px;
        height: 880px;
      }
      .term-screen {
        position: absolute;
        left: 0;
        right: 0;
        top: 56px;
        bottom: 0;
        overflow: hidden;
      }
      /* A wide, short package card: the facts sit beside the size. */
      #pkg .pkg-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 48px;
        align-items: start;
      }
      #pkg .pkg-body > :not(.pkg-facts) {
        grid-column: 1;
      }
      #pkg .pkg-facts {
        grid-column: 2;
        grid-row: 1 / span 4;
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="format"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="13"
    >
      <div class="backdrop"></div>
      <div id="scene" class="clip" data-start="0" data-duration="13">
        <div class="shell">
          <div class="shell-bar">
            <span class="lights-slot"></span>ledger.ts — reports<span class="tag">@syntaxless/format</span>
          </div>
        </div>
        <div class="panel" id="editor">
          <div class="panel-head">ledger.ts<span class="tag">TypeScript</span></div>
          <div class="code" id="code"></div>
          <div class="focus"></div>
        </div>
        <div class="panel" id="pkg"></div>
        <div class="panel" id="term">
          <div class="panel-head">Terminal<span class="tag">~/reports</span></div>
          <div class="term-screen"><div class="term-body" id="termBody"></div></div>
          <div class="focus"></div>
        </div>
      </div>
    </div>

    <script src="shared/sx.js"></script>
    <script>
      (function () {
        const D = 13;
        const $ = (id) => document.getElementById(id);
        for (const slot of document.querySelectorAll(".lights-slot")) slot.outerHTML = SX.LIGHTS;

        const lines = SX.code($("code"), [
          'import { parse, compile } from "@syntaxless/format";',
          'import { ledger } from "./q3"; // [-1234.5, 98000, 0.4567, ...]',
          "",
          'const fmt = await parse("{{q}}");',
          "if (!fmt.ok) throw new Error(fmt.reason);",
          "",
          "// same intent, any locale: no re-parse",
          'const money = compile(fmt.intent, { locale: "{{loc}}" });',
          "if (money.supported) {",
          "  for (const n of ledger) console.log(money.formatter.format(n).text);",
          "}",
        ]);
        const bar = SX.packageCard($("pkg"), "format", 37.5);
        const field = new SX.Field($("q"), { seed: 51, bar: true });
        const loc = new SX.Field($("loc"), { seed: 7, bar: true });
        loc.set(0, "en-US");
        const pointer = SX.pointer($("scene"));

        // Output of running this file with Bun, for each locale.
        const term = new SX.Terminal($("termBody"), { rows: 20, seed: 6 });
        const US = ["(€1,234.50)", "€98,000.00", "€0.46", "€1,250,000.00", "(€0.04)", "€18.90"];
        const DE = ["(1.234,50 €)", "98.000,00 €", "0,46 €", "1.250.000,00 €", "(0,04 €)", "18,90 €"];

        const tl = gsap.timeline({ paused: true });
        const init = (target, vars) => {
          gsap.set(target, vars);
          tl.set(target, vars, 0);
        };
        init(".focus, .ln .hl", { opacity: 0 });
        init(".lights .live", { opacity: 0 });
        init("#code, .term-screen, #pkg .pkg-body", { opacity: 1 });
        init(bar, { scaleX: 0 });
        init("#pkg .pkg-value", { opacity: 0 });

        const hand = SX.hand(tl, pointer);
        const REST = [1690, 560];
        hand.place(0, REST[0], REST[1]);
        const LINE = (i) => 202 + 42 * i + 21;
        const COL = (c) => 148 + c * 14.4;
        const TERM = [1580, 330];
        const focusTo = (from, to, t) => {
          if (from) tl.to(from + " > .focus", { opacity: 0, duration: 0.3, ease: "sx.swap" }, t);
          tl.to(to + " > .focus", { opacity: 1, duration: 0.3, ease: "sx.swap" }, t);
        };

        // Click into the string, then describe the format in English.
        const tA = hand.move(0.3, COL(25) + 12, LINE(3) + 6);
        hand.click(tA);
        tl.to(".lights .live", { opacity: 1, duration: 0.2, ease: "sx.swap" }, tA + 0.1);
        focusTo(null, "#editor", tA + 0.1);
        tl.to(lines[3].querySelector(".hl"), { opacity: 1, duration: 0.25, ease: "sx.swap" }, tA + 0.1);
        field.focus(tA + 0.1);
        hand.move(tA + 0.45, REST[0], REST[1], 0.85);
        const typed1 = field.type(tA + 0.35, "euros, two decimals, negatives in parentheses", 1.2);

        // Click the terminal and run it.
        const tT = hand.move(typed1 + 0.2, TERM[0], TERM[1]);
        hand.click(tT);
        field.blur(tT + 0.1);
        focusTo("#editor", "#term", tT + 0.1);
        hand.move(tT + 0.35, REST[0], REST[1], 0.7);
        const run1 = term.at(tT + 0.25).type("bun ledger.ts", 1.2).enter(US, 0.35);
        const tOut1 = run1.end;
        // The first parse loads the package and its model, once.
        tl.to("#pkg .pkg-value", { opacity: 1, duration: 0.3, ease: "sx.swap" }, tOut1 - 0.3);
        tl.to(bar, { scaleX: 1, duration: 0.7, ease: "sx.out" }, tOut1 - 0.3);

        // Change only the locale: select it, type another.
        const tB = hand.move(tOut1 + 1.3, COL(45) + 36, LINE(7) + 6);
        hand.click(tB);
        hand.click(tB + 0.18);
        focusTo("#term", "#editor", tB + 0.1);
        tl.to(lines[3].querySelector(".hl"), { opacity: 0, duration: 0.25, ease: "sx.swap" }, tB + 0.1);
        tl.to(lines[7].querySelector(".hl"), { opacity: 1, duration: 0.25, ease: "sx.swap" }, tB + 0.1);
        loc.focus(tB + 0.1);
        const tSel = loc.replace(tB + 0.3, 0.3);
        hand.move(tB + 0.5, REST[0], REST[1], 0.85);
        const typed2 = loc.type(tSel + 0.12, "de-DE", 0.9);

        // Run it again: up arrow recalls the command. Same intent, no re-parse.
        const tT2 = hand.move(typed2 + 0.25, TERM[0], TERM[1]);
        hand.click(tT2);
        loc.blur(tT2 + 0.1);
        focusTo("#editor", "#term", tT2 + 0.1);
        hand.move(tT2 + 0.35, REST[0], REST[1], 0.7);
        const run2 = term.at(tT2 + 0.3).recall("bun ledger.ts", 0.2).enter(DE, 0.3);

        // Loop: only the sub-cards' contents dip, then return to the opening frame.
        const tReset = D - 0.75;
        const tR = tReset + 0.33;
        const DIP = "#code, .term-screen, #pkg .pkg-body";
        tl.to(DIP, { opacity: 0, duration: 0.32, ease: "sx.in" }, tReset);
        term.clear(tR);
        field.set(tR, "");
        loc.set(tR, "en-US");
        tl.set(".focus, .ln .hl", { opacity: 0 }, tR);
        tl.set(".lights .live", { opacity: 0 }, tR);
        tl.set(bar, { scaleX: 0 }, tR);
        tl.set("#pkg .pkg-value", { opacity: 0 }, tR);
        tl.to(DIP, { opacity: 1, duration: 0.34, ease: "sx.out" }, tR + 0.01);
        tl.set({}, {}, D);

        SX.drive(tl, D, (t) => {
          field.render(t);
          loc.render(t);
          term.render(t);
        });
        window.__marks = { typed1, tOut1, typed2, run2: run2.end, tReset };
        console.log("marks " + JSON.stringify(window.__marks));
        window.__timelines["format"] = tl;
      })();
    </script>
  </body>
</html>
