<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Syntaxless: validation</title>
    <script src="shared/vendor/gsap.min.js"></script>
    <script src="shared/vendor/CustomEase.min.js"></script>
    <link rel="stylesheet" href="shared/sx.css" />
    <style>
      /* The run prints three schemas, 15 lines in all, so the terminal takes a full-height
         column on the right and the package card sits under the editor. */
      #editor {
        left: 72px;
        top: 128px;
        width: 1236px;
        height: 580px;
      }
      #term {
        left: 1328px;
        top: 128px;
        width: 520px;
        height: 880px;
      }
      #pkg {
        left: 72px;
        top: 728px;
        width: 1236px;
        height: 280px;
      }
      .term-screen {
        position: absolute;
        left: 0;
        right: 0;
        top: 56px;
        bottom: 0;
        overflow: hidden;
      }
      /* Output never fills this column, so it starts at the top, as a fresh terminal does. */
      #term .term-body {
        top: 18px;
        bottom: auto;
      }
      .s,
      .n {
        color: var(--ink);
      }
      /* A wide, short package card: the size on the left, the facts beside it. */
      #pkg .pkg-body {
        position: relative;
      }
      #pkg .pkg-label,
      #pkg .pkg-value,
      #pkg .pkg-bar,
      #pkg .pkg-scale {
        width: 680px;
      }
      #pkg .pkg-facts {
        position: absolute;
        left: 800px;
        top: 26px;
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="validation"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="13.5"
    >
      <div class="backdrop"></div>
      <div id="scene" class="clip" data-start="0" data-duration="13.5">
        <div class="shell">
          <div class="shell-bar">
            <span class="lights-slot"></span>signup.ts — form builder<span class="tag">@syntaxless/validation</span>
          </div>
        </div>
        <div class="panel" id="editor">
          <div class="panel-head">signup.ts<span class="tag">TypeScript</span></div>
          <div class="code" id="code"></div>
          <div class="focus"></div>
        </div>
        <div class="panel" id="term">
          <div class="panel-head">Terminal<span class="tag">~/form-builder</span></div>
          <div class="term-screen"><div class="term-body" id="termBody"></div></div>
          <div class="focus"></div>
        </div>
        <div class="panel" id="pkg"></div>
      </div>
    </div>

    <script src="shared/sx.js"></script>
    <script>
      (function () {
        const D = 13.5;
        const $ = (id) => document.getElementById(id);
        for (const slot of document.querySelectorAll(".lights-slot")) slot.outerHTML = SX.LIGHTS;

        const lines = SX.code($("code"), [
          'import { schema } from "@syntaxless/validation";',
          "",
          "// one rule per field, written the way a person says it",
          'const email = await schema("{{a}}");',
          'const seats = await schema("{{b}}");',
          'const color = await schema("{{c}}");',
          "",
          "for (const field of [email, seats, color]) {",
          "  console.log(field.supported ? field.schema : field.code);",
          "}",
        ]);
        const bar = SX.packageCard($("pkg"), "validation", 75.5);
        const fields = [
          new SX.Field($("a"), { seed: 31, bar: true }),
          new SX.Field($("b"), { seed: 32, bar: true }),
          new SX.Field($("c"), { seed: 33, bar: true }),
        ];
        const pointer = SX.pointer($("scene"));

        // Output of running this file with Bun.
        const k = (v) => "  " + v + ": ";
        const s = (v) => '<span class="s">"' + v + '"</span>';
        const n = (v) => '<span class="n">' + v + "</span>";
        const OUT = [
          "{",
          k("type") + s("string") + ",",
          k("format") + s("email") + ",",
          k("minLength") + n(1) + ",",
          k("maxLength") + n(100) + ",",
          "}",
          "{",
          k("type") + s("integer") + ",",
          k("minimum") + n(1) + ",",
          k("maximum") + n(10) + ",",
          "}",
          '<span class="del">unrecognized</span>',
        ];
        const term = new SX.Terminal($("termBody"), { rows: 20, seed: 3 });

        const tl = gsap.timeline({ paused: true });
        const init = (target, vars) => {
          gsap.set(target, vars);
          tl.set(target, vars, 0);
        };
        init(".focus, .ln .hl", { opacity: 0 });
        init(".lights .live", { opacity: 0 });
        init("#code, .term-screen, #pkg .pkg-body", { opacity: 1 });
        init(bar, { scaleX: 0 });
        init("#pkg .pkg-value", { opacity: 0 });

        const hand = SX.hand(tl, pointer);
        const REST = [1220, 470];
        hand.place(0, REST[0], REST[1]);
        const LINE = (i) => 202 + 42 * i + 21;
        const STR_X = 148 + 28 * 14.4;
        const TERM = [1590, 560];

        // One field at a time: click into its string, then say the rule in English.
        const RULES = [
          ["required email with max 100 characters", 1.25],
          ["optional integer between 1 and 10", 1.25],
          ["every weekday at 9", 1.1],
        ];
        let t = 0.3;
        let typed = 0;
        const typedAt = [];
        RULES.forEach(([rule, speed], i) => {
          const line = 3 + i;
          const tIn = hand.move(t, STR_X + 12, LINE(line) + 6);
          hand.click(tIn);
          if (i === 0) {
            tl.to(".lights .live", { opacity: 1, duration: 0.2, ease: "sx.swap" }, tIn + 0.1);
            tl.to("#editor > .focus", { opacity: 1, duration: 0.3, ease: "sx.swap" }, tIn + 0.1);
          } else {
            fields[i - 1].blur(tIn + 0.1);
            tl.to(lines[line - 1].querySelector(".hl"), { opacity: 0, duration: 0.25, ease: "sx.swap" }, tIn + 0.1);
          }
          tl.to(lines[line].querySelector(".hl"), { opacity: 1, duration: 0.25, ease: "sx.swap" }, tIn + 0.1);
          fields[i].focus(tIn + 0.1);
          hand.move(tIn + 0.4, REST[0], REST[1], 0.75);
          typed = fields[i].type(tIn + 0.35, rule, speed);
          typedAt.push(typed);
          t = typed + 0.25;
        });

        // Click the terminal and run it: two schemas, and a refusal for the rule that is not one.
        const tT = hand.move(t, TERM[0], TERM[1]);
        hand.click(tT);
        fields[2].blur(tT + 0.1);
        tl.to("#editor > .focus", { opacity: 0, duration: 0.3, ease: "sx.swap" }, tT + 0.1);
        tl.to("#term > .focus", { opacity: 1, duration: 0.3, ease: "sx.swap" }, tT + 0.1);
        hand.move(tT + 0.35, REST[0], REST[1], 0.7);
        const run = term.at(tT + 0.25).type("bun signup.ts", 1.2).enter(OUT, 0.35);
        const tOut = run.end;
        // The first call loads the package and its model, once.
        tl.to("#pkg .pkg-value", { opacity: 1, duration: 0.3, ease: "sx.swap" }, tOut - 0.3);
        tl.to(bar, { scaleX: 1, duration: 0.7, ease: "sx.out" }, tOut - 0.3);

        // Loop: only the sub-cards' contents dip, then return to the opening frame.
        const tReset = D - 0.75;
        const tR = tReset + 0.33;
        const DIP = "#code, .term-screen, #pkg .pkg-body";
        tl.to(DIP, { opacity: 0, duration: 0.32, ease: "sx.in" }, tReset);
        term.clear(tR);
        for (const f of fields) f.set(tR, "");
        tl.set(".focus, .ln .hl", { opacity: 0 }, tR);
        tl.set(".lights .live", { opacity: 0 }, tR);
        tl.set(bar, { scaleX: 0 }, tR);
        tl.set("#pkg .pkg-value", { opacity: 0 }, tR);
        tl.to(DIP, { opacity: 1, duration: 0.34, ease: "sx.out" }, tR + 0.01);
        tl.set({}, {}, D);

        SX.drive(tl, D, (now) => {
          for (const f of fields) f.render(now);
          term.render(now);
        });
        window.__marks = { typedA: typedAt[0], typedB: typedAt[1], typedC: typedAt[2], tOut, tReset };
        console.log("marks " + JSON.stringify(window.__marks));
        window.__timelines["validation"] = tl;
      })();
    </script>
  </body>
</html>
