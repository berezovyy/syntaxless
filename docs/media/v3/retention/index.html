<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Syntaxless: retention</title>
    <script src="shared/vendor/gsap.min.js"></script>
    <script src="shared/vendor/CustomEase.min.js"></script>
    <link rel="stylesheet" href="shared/sx.css" />
    <style>
      #editor {
        left: 72px;
        top: 128px;
        width: 1776px;
        height: 428px;
      }
      #prev {
        left: 72px;
        top: 576px;
        width: 1316px;
        height: 432px;
      }
      #pkg {
        left: 1408px;
        top: 576px;
        width: 440px;
        height: 432px;
      }

      /* ---------- Preview: 420 daily backups, one cell a day ---------- */
      .prev-body {
        position: absolute;
        left: 0;
        right: 0;
        top: 56px;
        bottom: 0;
        box-sizing: border-box;
        /* 61 weeks x 20px = 1216px of grid, centred: the text aligns to its edges. */
        padding: 0 49px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .prev-top {
        display: flex;
        justify-content: space-between;
        font-size: 20px;
        color: var(--ink-2);
      }
      .months {
        position: relative;
        margin-top: 24px;
        height: 28px;
        font-size: 16px;
        color: var(--ink-3);
      }
      .months span {
        position: absolute;
        top: 0;
      }
      .grid {
        position: relative;
        height: 136px;
      }
      .cell {
        position: absolute;
        width: 16px;
        height: 16px;
        box-sizing: border-box;
        border-radius: 3px;
        border: 1px solid var(--line-2);
        background: var(--line-2);
      }
      .rfoot {
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 20px;
        color: var(--ink-2);
      }
      .legend {
        display: flex;
        gap: 30px;
      }
      .legend i {
        display: inline-block;
        width: 16px;
        height: 16px;
        border-radius: 3px;
        margin-right: 10px;
        vertical-align: -2px;
        box-sizing: border-box;
      }
      .legend .lk {
        background: var(--add);
      }
      .legend .lr {
        border: 1px solid var(--line-2);
      }
      .tally {
        font-size: 25px;
        color: var(--ink-2);
      }
      .tally b {
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="retention"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="8.6"
    >
      <div class="backdrop"></div>
      <div id="scene" class="clip" data-start="0" data-duration="8.6">
        <div class="shell">
          <div class="shell-bar">
            <span class="lights-slot"></span>prune.ts — backups<span class="tag">@syntaxless/retention</span>
          </div>
        </div>
        <div class="panel" id="editor">
          <div class="panel-head">prune.ts<span class="tag">TypeScript</span></div>
          <div class="code" id="code"></div>
          <div class="focus"></div>
        </div>
        <div class="panel" id="prev">
          <div class="panel-head">Preview · localhost:5173<span class="tag">render(plan)</span></div>
          <div class="prev-body">
            <div class="prev-top">
              <span>420 daily snapshots · UTC</span><span class="faint">a recommendation: nothing is deleted</span>
            </div>
            <div class="months" id="months"></div>
            <div class="grid" id="grid"></div>
            <div class="rfoot">
              <div class="legend"><span><i class="lk"></i>keep</span><span><i class="lr"></i>remove</span></div>
              <div class="tally">keep <b class="add" id="nKeep">420</b> · remove <b class="del" id="nRemove">0</b></div>
            </div>
          </div>
          <div class="focus"></div>
        </div>
        <div class="panel" id="pkg"></div>
      </div>
    </div>

    <script src="shared/sx.js"></script>
    <script>
      (function () {
        const D = 8.6;
        const $ = (id) => document.getElementById(id);
        for (const slot of document.querySelectorAll(".lights-slot")) slot.outerHTML = SX.LIGHTS;

        const lines = SX.code($("code"), [
          'import { parse, compile } from "@syntaxless/retention";',
          'import { backups, referenceInstant, render } from "./storage"; // 420 daily snapshots',
          "",
          'const policy = await parse("{{q}}");',
          "if (policy.ok) {",
          '  const plan = compile(policy.intent, { timeZone: "UTC", referenceInstant, backups });',
          "  render(plan); // a recommendation: nothing is deleted",
          "}",
        ]);
        const bar = SX.packageCard($("pkg"), "retention", 35.7);
        const field = new SX.Field($("q"), { seed: 81, bar: true });
        const pointer = SX.pointer($("scene"));

        // compile(intent, { timeZone: "UTC", referenceInstant: 2026-10-12T12:00Z, backups }) with
        // one backup a day for 420 days keeps these 18 ids (7 daily, 12 monthly, one shared).
        const KEEP = new Set([
          "2026-10-12", "2026-10-11", "2026-10-10", "2026-10-09", "2026-10-08", "2026-10-07", "2026-10-06",
          "2026-09-30", "2026-08-31", "2026-07-31", "2026-06-30", "2026-05-31", "2026-04-30", "2026-03-31",
          "2026-02-28", "2026-01-31", "2025-12-31", "2025-11-30",
        ]);
        const MONTH = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
        const DAY = 86400000;
        const COUNT = 420;
        const CELL = 20;
        const oldest = Date.UTC(2026, 9, 12) - (COUNT - 1) * DAY;
        const firstMonday = oldest - ((new Date(oldest).getUTCDay() + 6) % 7) * DAY;
        const cells = [];
        let lastMonth = -1;
        for (let i = 0; i < COUNT; i++) {
          const ts = oldest + i * DAY;
          const d = new Date(ts);
          const col = Math.floor((ts - firstMonday) / DAY / 7);
          const el = document.createElement("div");
          el.className = "cell";
          el.style.left = col * CELL + "px";
          el.style.top = ((d.getUTCDay() + 6) % 7) * CELL + "px";
          $("grid").appendChild(el);
          cells.push({ el, col, keep: KEEP.has(d.toISOString().slice(0, 10)) });
          if (d.getUTCMonth() !== lastMonth && d.getUTCDate() <= 7) {
            lastMonth = d.getUTCMonth();
            const m = document.createElement("span");
            m.textContent = MONTH[lastMonth];
            m.style.left = col * CELL + "px";
            $("months").appendChild(m);
          }
        }
        const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
        const ADD = css("--add");
        const LINE_2 = css("--line-2");

        const tl = gsap.timeline({ paused: true });
        const init = (target, vars) => {
          gsap.set(target, vars);
          tl.set(target, vars, 0);
        };
        init(".focus, .ln .hl", { opacity: 0 });
        init(".lights .live", { opacity: 0 });
        init("#code, .prev-body, #pkg .pkg-body", { opacity: 1 });
        init(bar, { scaleX: 0 });
        init("#pkg .pkg-value", { opacity: 0 });
        init(cells.map((c) => c.el), { backgroundColor: LINE_2, borderColor: LINE_2 });
        init(".legend, .tally", { opacity: 0.4 });
        const keepSteps = [];
        const removeSteps = [];

        const hand = SX.hand(tl, pointer);
        const REST = [1640, 470];
        hand.place(0, REST[0], REST[1]);
        const LINE = (i) => 202 + 42 * i + 21;
        const COL = (c) => 148 + c * 14.4;

        // Click into the string, then write the policy in English.
        const tA = hand.move(0.3, COL(28) + 12, LINE(3) + 6);
        hand.click(tA);
        tl.to(".lights .live", { opacity: 1, duration: 0.2, ease: "sx.swap" }, tA + 0.1);
        tl.to("#editor > .focus", { opacity: 1, duration: 0.3, ease: "sx.swap" }, tA + 0.1);
        tl.to(lines[3].querySelector(".hl"), { opacity: 1, duration: 0.25, ease: "sx.swap" }, tA + 0.1);
        field.focus(tA + 0.1);
        hand.move(tA + 0.45, REST[0], REST[1], 0.85);
        const typed1 = field.type(tA + 0.35, "keep daily backups for a week and monthly backups for a year", 1.2);

        // The preview reloads and sweeps oldest to newest: removals hollow out, keepers turn green.
        const tSweep = typed1 + 0.45;
        field.blur(tSweep - 0.1);
        tl.to("#editor > .focus", { opacity: 0, duration: 0.3, ease: "sx.swap" }, tSweep - 0.1);
        tl.to("#prev > .focus", { opacity: 1, duration: 0.3, ease: "sx.swap" }, tSweep - 0.1);
        // The first parse loads the package and its model, once.
        tl.to("#pkg .pkg-value", { opacity: 1, duration: 0.3, ease: "sx.swap" }, tSweep - 0.3);
        tl.to(bar, { scaleX: 1, duration: 0.7, ease: "sx.out" }, tSweep - 0.3);
        const SWEEP = 1.3;
        const maxCol = cells[cells.length - 1].col;
        cells.forEach((c) => {
          const t = tSweep + (c.col / maxCol) * SWEEP;
          tl.to(
            c.el,
            c.keep
              ? { backgroundColor: ADD, borderColor: ADD, duration: 0.3, ease: "sx.swap" }
              : { backgroundColor: "rgba(0,0,0,0)", duration: 0.3, ease: "sx.swap" },
            t,
          );
        });
        tl.to(".legend, .tally", { opacity: 1, duration: 0.4, ease: "sx.swap" }, tSweep + 0.2);
        keepSteps.push([tSweep, 420, 18, SWEEP + 0.1]);
        removeSteps.push([tSweep, 0, 402, SWEEP + 0.1]);
        const tSwept = tSweep + SWEEP + 0.3;

        // Loop: only the sub-cards' contents dip, then return to the opening frame.
        const tReset = D - 0.75;
        const tR = tReset + 0.33;
        const DIP = "#code, .prev-body, #pkg .pkg-body";
        tl.to(DIP, { opacity: 0, duration: 0.32, ease: "sx.in" }, tReset);
        field.set(tR, "");
        tl.set(".focus, .ln .hl", { opacity: 0 }, tR);
        tl.set(".lights .live", { opacity: 0 }, tR);
        tl.set(bar, { scaleX: 0 }, tR);
        tl.set("#pkg .pkg-value", { opacity: 0 }, tR);
        tl.set(cells.map((c) => c.el), { backgroundColor: LINE_2, borderColor: LINE_2 }, tR);
        tl.set(".legend, .tally", { opacity: 0.4 }, tR);
        keepSteps.push([tR, 18, 420, 0]);
        removeSteps.push([tR, 402, 0, 0]);
        tl.to(DIP, { opacity: 1, duration: 0.34, ease: "sx.out" }, tR + 0.01);
        tl.set({}, {}, D);

        // Counters are pure functions of time, drawn by the driver with the field.
        const keepVal = SX.counter(keepSteps, 420);
        const removeVal = SX.counter(removeSteps, 0);
        const text = (id) => {
          const el = $(id);
          let last = null;
          return (s) => {
            if (s !== last) el.textContent = last = s;
          };
        };
        const outKeep = text("nKeep");
        const outRemove = text("nRemove");
        SX.drive(tl, D, (t) => {
          field.render(t);
          outKeep(String(Math.round(keepVal(t))));
          outRemove(String(Math.round(removeVal(t))));
        });
        window.__marks = { typed1, tSweep, tSwept, tReset };
        console.log("marks " + JSON.stringify(window.__marks));
        window.__timelines["retention"] = tl;
      })();
    </script>
  </body>
</html>
