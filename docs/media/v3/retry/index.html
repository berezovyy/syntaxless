<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Syntaxless: retry</title>
    <script src="shared/vendor/gsap.min.js"></script>
    <script src="shared/vendor/CustomEase.min.js"></script>
    <link rel="stylesheet" href="shared/sx.css" />
    <style>
      /* 11 lines of code: a taller editor, a shorter bottom row. */
      #editor {
        left: 72px;
        top: 128px;
        width: 1776px;
        height: 554px;
      }
      #term {
        left: 72px;
        top: 702px;
        width: 996px;
        height: 306px;
      }
      #pkg {
        left: 1088px;
        top: 702px;
        width: 760px;
        height: 306px;
      }
      .term-screen {
        position: absolute;
        left: 0;
        right: 0;
        top: 56px;
        bottom: 0;
        overflow: hidden;
      }
      /* The bottom row is short: the package card lays its facts beside the size. */
      #pkg .pkg-body {
        display: grid;
        grid-template-columns: 1fr 1fr;
        column-gap: 48px;
        align-items: start;
      }
      #pkg .pkg-body > :not(.pkg-facts) {
        grid-column: 1;
      }
      #pkg .pkg-facts {
        grid-column: 2;
        grid-row: 1 / span 4;
        margin-top: 0;
      }
      /* The options argument being added reads as the subject of the edit. */
      #opt .text {
        color: var(--ink);
      }
      /* "█".repeat(ms / 125) drawn as one solid run, so the glyphs show no seams. */
      .blk {
        display: inline-block;
        height: 22px;
        vertical-align: -3px;
        border-radius: 3px;
        background: var(--ink-2);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="retry"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="14.4"
    >
      <div class="backdrop"></div>
      <div id="scene" class="clip" data-start="0" data-duration="14.4">
        <div class="shell">
          <div class="shell-bar">
            <span class="lights-slot"></span>deliver.ts — webhooks<span class="tag">@syntaxless/retry</span>
          </div>
        </div>
        <div class="panel" id="editor">
          <div class="panel-head">deliver.ts<span class="tag">TypeScript</span></div>
          <div class="code" id="code"></div>
          <div class="focus"></div>
        </div>
        <div class="panel" id="term">
          <div class="panel-head">Terminal<span class="tag">~/webhooks</span></div>
          <div class="term-screen"><div class="term-body" id="termBody"></div></div>
          <div class="focus"></div>
        </div>
        <div class="panel" id="pkg"></div>
      </div>
    </div>

    <script src="shared/sx.js"></script>
    <script>
      (function () {
        const D = 14.4;
        const $ = (id) => document.getElementById(id);
        for (const slot of document.querySelectorAll(".lights-slot")) slot.outerHTML = SX.LIGHTS;

        const lines = SX.code($("code"), [
          'import { parse, compile } from "@syntaxless/retry";',
          "",
          "const policy = await parse(",
          '  "{{q}}",',
          "  {{opt}}",
          ");",
          "if (!policy.ok) console.log(policy.code);",
          "else {",
          "  const plan = compile(policy.intent); // the schedule only; your code makes the calls",
          '  if (plan.supported) for (const ms of plan.delaysMs) console.log("█".repeat(ms / 125), ms);',
          "}",
        ]);
        const bar = SX.packageCard($("pkg"), "retry", 35.9);
        const field = new SX.Field($("q"), { seed: 61, bar: true });
        const opt = new SX.Field($("opt"), { seed: 9, bar: true });
        const pointer = SX.pointer($("scene"));

        // Output of running this file with Bun, without and with the caller default.
        const delay = (ms) => '<span class="blk" style="width:' + (ms / 125) * 0.6 + 'em"></span> ' + ms;
        const term = new SX.Terminal($("termBody"), { rows: 5, seed: 7 });

        const tl = gsap.timeline({ paused: true });
        const init = (target, vars) => {
          gsap.set(target, vars);
          tl.set(target, vars, 0);
        };
        init(".focus, .ln .hl", { opacity: 0 });
        init(".lights .live", { opacity: 0 });
        init("#code, .term-screen, #pkg .pkg-body", { opacity: 1 });
        init(bar, { scaleX: 0 });
        init("#pkg .pkg-value", { opacity: 0 });

        const hand = SX.hand(tl, pointer);
        const REST = [880, 905];
        hand.place(0, REST[0], REST[1]);
        const LINE = (i) => 202 + 42 * i + 21;
        const COL = (c) => 148 + c * 14.4;
        const TERM = [560, 860];
        const focusTo = (from, to, t) => {
          if (from) tl.to(from + " > .focus", { opacity: 0, duration: 0.3, ease: "sx.swap" }, t);
          tl.to(to + " > .focus", { opacity: 1, duration: 0.3, ease: "sx.swap" }, t);
        };

        // Click into the string, then write the policy in English.
        const tA = hand.move(0.3, COL(3) + 12, LINE(3) + 6);
        hand.click(tA);
        tl.to(".lights .live", { opacity: 1, duration: 0.2, ease: "sx.swap" }, tA + 0.1);
        focusTo(null, "#editor", tA + 0.1);
        tl.to(lines[3].querySelector(".hl"), { opacity: 1, duration: 0.25, ease: "sx.swap" }, tA + 0.1);
        field.focus(tA + 0.1);
        hand.move(tA + 0.45, REST[0], REST[1], 0.85);
        const typed1 = field.type(tA + 0.35, "retry three times, double the delay, cap at one minute", 1.25);

        // Click the terminal and run it: the package refuses to invent a first delay.
        const tT = hand.move(typed1 + 0.2, TERM[0], TERM[1]);
        hand.click(tT);
        field.blur(tT + 0.1);
        focusTo("#editor", "#term", tT + 0.1);
        hand.move(tT + 0.35, REST[0], REST[1], 0.7);
        const run1 = term
          .at(tT + 0.25)
          .type("bun deliver.ts", 1.2)
          .enter(['<span class="del">missing-initial-delay</span>'], 0.35);
        const tOut1 = run1.end;
        // The first parse loads the package and its model, once.
        tl.to("#pkg .pkg-value", { opacity: 1, duration: 0.3, ease: "sx.swap" }, tOut1 - 0.3);
        tl.to(bar, { scaleX: 1, duration: 0.7, ease: "sx.out" }, tOut1 - 0.3);

        // Supply the default it refused to invent: click the empty argument line and type it.
        const tB = hand.move(tOut1 + 1.2, COL(2) + 8, LINE(4) + 6);
        hand.click(tB);
        focusTo("#term", "#editor", tB + 0.1);
        tl.to(lines[3].querySelector(".hl"), { opacity: 0, duration: 0.25, ease: "sx.swap" }, tB + 0.1);
        tl.to(lines[4].querySelector(".hl"), { opacity: 1, duration: 0.25, ease: "sx.swap" }, tB + 0.1);
        opt.focus(tB + 0.1);
        hand.move(tB + 0.45, REST[0], REST[1], 0.85);
        const typed2 = opt.type(tB + 0.35, "{ defaults: { initialDelayMs: 250 } },", 1.1);

        // Run it again: up arrow recalls the command.
        const tT2 = hand.move(typed2 + 0.2, TERM[0], TERM[1]);
        hand.click(tT2);
        opt.blur(tT2 + 0.1);
        focusTo("#editor", "#term", tT2 + 0.1);
        hand.move(tT2 + 0.35, REST[0], REST[1], 0.7);
        const run2 = term
          .at(tT2 + 0.3)
          .recall("bun deliver.ts", 0.2)
          .enter([delay(250), delay(500), delay(1000)], 0.3);

        // Loop: only the sub-cards' contents dip, then return to the opening frame.
        const tReset = D - 0.75;
        const tR = tReset + 0.33;
        const DIP = "#code, .term-screen, #pkg .pkg-body";
        tl.to(DIP, { opacity: 0, duration: 0.32, ease: "sx.in" }, tReset);
        term.clear(tR);
        field.set(tR, "");
        opt.set(tR, "");
        tl.set(".focus, .ln .hl", { opacity: 0 }, tR);
        tl.set(".lights .live", { opacity: 0 }, tR);
        tl.set(bar, { scaleX: 0 }, tR);
        tl.set("#pkg .pkg-value", { opacity: 0 }, tR);
        tl.to(DIP, { opacity: 1, duration: 0.34, ease: "sx.out" }, tR + 0.01);
        tl.set({}, {}, D);

        SX.drive(tl, D, (t) => {
          field.render(t);
          opt.render(t);
          term.render(t);
        });
        window.__marks = { typed1, tOut1, typed2, run2: run2.end, tReset };
        console.log("marks " + JSON.stringify(window.__marks));
        window.__timelines["retry"] = tl;
      })();
    </script>
  </body>
</html>
